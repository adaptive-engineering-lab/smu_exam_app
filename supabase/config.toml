# Supabase CLI project config.
# project_id is set per-environment via `supabase link --project-ref <ref>`.

project_id = "smu-exam-app"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/reset-password",
]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.submissions]
public = false

[functions.submit-attempt]
verify_jwt = true

[functions.import-questions-csv]
verify_jwt = true

[functions.admin-user-management]
verify_jwt = true

[functions.get-attempt-pdf]
verify_jwt = true
