name: Deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Backend: build Docker image → Azure Container Registry → App Service ──
  deploy-backend:
    name: Backend → Azure App Service
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
          az acr login --name "$ACR_NAME"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/smu-exam-backend:${{ github.sha }},${{ secrets.ACR_LOGIN_SERVER }}/smu-exam-backend:latest

      - name: Grant App Service pull access to ACR
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
          az webapp identity assign -g smu-exam-rg -n "$AZURE_WEBAPP_NAME" >/dev/null
          PRINCIPAL_ID=$(az webapp identity show -g smu-exam-rg -n "$AZURE_WEBAPP_NAME" --query principalId -o tsv)
          ACR_ID=$(az acr show -g smu-exam-rg -n "$ACR_NAME" --query id -o tsv)
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role AcrPull \
            --scope "$ACR_ID" >/dev/null || true

      - name: Deploy container to Azure App Service
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/smu-exam-backend:${{ github.sha }}"
          az webapp config container set \
            -g smu-exam-rg \
            -n "$AZURE_WEBAPP_NAME" \
            --container-image-name "$IMAGE"
          az webapp restart -g smu-exam-rg -n "$AZURE_WEBAPP_NAME"

      - name: Smoke test backend
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          URL="https://${AZURE_WEBAPP_NAME}.azurewebsites.net/health"
          for i in {1..12}; do
            if curl -fsS "$URL" >/dev/null; then
              echo "Backend health check passed: $URL"
              exit 0
            fi
            echo "Waiting for backend to become healthy ($i/12)..."
            sleep 10
          done
          echo "Backend health check failed: $URL"
          exit 1

  # ── Frontend: build Vite → Azure Static Web Apps ──────────────────────────
  deploy-frontend:
    name: Frontend → Azure Static Web Apps
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Static Web Apps
        run: |
          npx -y @azure/static-web-apps-cli deploy ./frontend/dist \
            --app-name "smu-exam-frontend" \
            --resource-group "smu-exam-rg" \
            --subscription-id "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --swa-config-location "./frontend" \
            --env production

      - name: Smoke test frontend
        run: |
          URL="https://salmon-rock-03519d203.6.azurestaticapps.net"
          for i in {1..12}; do
            if curl -fsS "$URL" >/dev/null; then
              echo "Frontend availability check passed: $URL"
              exit 0
            fi
            echo "Waiting for frontend deployment to propagate ($i/12)..."
            sleep 10
          done
          echo "Frontend availability check failed: $URL"
          exit 1
